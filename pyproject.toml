[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "click-sos-backend"
version = "0.1.0"
description = "Estrutura inicial da API do Click S.O.S"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "geoalchemy2>=0.15,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_functions = ["*_deve_*"]
markers = [
  "integracao: exige PostgreSQL/PostGIS em TEST_DATABASE_URL",
]

[tool.setuptools.packages.find]
where = ["src"]
